volumes:
  promoos-database-volume:
    name: promoos-database-volume
  rabbitmq_data:
  rabbitmq_logs:

services:
  promoos-database:
    image: postgres:17
    container_name: promoos-database
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: promoos
      POSTGRES_USER: promoos
      POSTGRES_PASSWORD: promoos
    volumes:
      - promoos-database-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d promoos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  rabbitmq:
      image: rabbitmq:3.13-management-alpine
      container_name: rabbitmq
      hostname: rabbitmq
      restart: unless-stopped
      ports:
        - "5672:5672"     # AMQP
        - "15672:15672"   # Management UI
      environment:
        RABBITMQ_DEFAULT_USER: guest
        RABBITMQ_DEFAULT_PASS: guest
        RABBITMQ_DEFAULT_VHOST: /
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
        - rabbitmq_logs:/var/log/rabbitmq
      healthcheck:
        test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
        interval: 30s
        timeout: 10s
        retries: 5
        start_period: 40s

  task-service:
      container_name: task-service
      build:
          context: .
      restart: unless-stopped          
      ports:
         - "8080:8080"        
      environment:
        ASPNETCORE_URLS: "http://+:8080"
        ASPNETCORE_ENVIRONMENT: "Production"
        ConnectionStrings__Default: "Host=promoos-database;Port=5432;Database=promoos;Username=promoos;Password=promoos"
        RabbitMqConfig__Host: "rabbitmq"
        RabbitMqConfig__Username: "guest"
        RabbitMqConfig__Password: "guest"
        RabbitMqConfig__Port: "5672"
        RabbitMqConfig__VirtualHost: "/"
      depends_on:
        promoos-database:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy

